# Drop this location block into /etc/nginx/sites-available/cowork
# (inside the existing server { } block, alongside the /adguard/ block).
#
# DO NOT enable nginx for /seo/ without the access control below. Reports
# carry per-page Search Console data and reports/pages_*/ holds copies of
# live article HTML; the server block listens on 0.0.0.0:80 with no TLS.
#
# To install (nginx is currently inactive on 5by5 — do not enable the unit
# as part of this change):
#   sudo cp nginx-seo-reports.conf /etc/nginx/sites-available/seo-reports.conf
#   # Then paste the location block below into /etc/nginx/sites-available/cowork
#   sudo nginx -t && sudo systemctl reload nginx
#
# Access reports at: http://<server-ip>/seo/  (localhost only by default —
# reach it over an SSH tunnel: ssh -L 8080:127.0.0.1:80 aiuser@5by5)

location /seo/ {
    # ALIAS MUST FOLLOW THE PROMOTE PATH. This is the dev tree; once promoted
    # the job writes to ~/aiscripts/seo-advisor/reports/ and this alias must
    # be changed to match, or /seo/ will serve stale dev reports.
    alias /home/aiuser/projects/seo-advisor/reports/;

    # Access control — loopback only. To allow LAN clients instead, replace
    # these two lines with basic auth:
    #   auth_basic           "SEO reports";
    #   auth_basic_user_file /etc/nginx/.htpasswd-seo;   # htpasswd -c ...
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    autoindex on;
    autoindex_localtime on;
    autoindex_exact_size off;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
}
