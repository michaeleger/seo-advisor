# Drop this location block into /etc/nginx/sites-available/cowork
# (inside the existing server { } block, alongside the /adguard/ block).
#
# To install:
#   sudo cp nginx-seo-reports.conf /etc/nginx/sites-available/seo-reports.conf
#   # Then paste the location block below into /etc/nginx/sites-available/cowork
#   sudo nginx -t && sudo systemctl reload nginx
#
# Access reports at: http://<server-ip>/seo/

location /seo/ {
    alias /home/aiuser/projects/seo-advisor/reports/;
    autoindex on;
    autoindex_localtime on;
    autoindex_exact_size off;
    add_header Cache-Control "no-cache";
}
