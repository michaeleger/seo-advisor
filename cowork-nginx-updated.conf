server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # catch-all

    # AdGuard Home UI via nice path
    location /adguard/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # SEO Advisor reports — per-page GSC data and copies of live article HTML.
    # Never serve without the access control below.
    location /seo/ {
        # ALIAS MUST FOLLOW THE PROMOTE PATH: switch to
        # /home/aiuser/aiscripts/seo-advisor/reports/ once promoted, or this
        # serves stale dev reports.
        alias /home/aiuser/projects/seo-advisor/reports/;

        # Loopback only (use an SSH tunnel). For LAN access swap in:
        #   auth_basic           "SEO reports";
        #   auth_basic_user_file /etc/nginx/.htpasswd-seo;
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        autoindex on;
        autoindex_localtime on;
        autoindex_exact_size off;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Future home for eagertobehealthy.com test site
    location / {
        root /var/www/html;
        try_files $uri $uri/ =404;
        index index.html;
    }
}
